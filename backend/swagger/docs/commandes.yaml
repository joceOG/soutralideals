paths:
  /api/commande:
    post:
      summary: Créer une commande (DASH-8E.3B.1 — Articles + JWT)
      description: |
        Contrat détaillé, exemples Next/Flutter et migration : `docs/api/COMMANDE_CREATE.md`.
        Authentification Bearer obligatoire. Acheteur = JWT. Vendeur dérivé des Articles.
        Mono-boutique uniquement. Pas de paiement sur cette route.
      tags: [Commandes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - infoCommande
                - articles
              properties:
                articles:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - articleId
                      - quantite
                    properties:
                      articleId:
                        type: string
                        description: ObjectId Article MongoDB
                        example: "68d6f43f92b0e26a12345678"
                      quantite:
                        type: integer
                        minimum: 1
                        example: 2
                infoCommande:
                  type: object
                  required:
                    - ville
                    - telephone
                    - codePostal
                    - pays
                  properties:
                    adresse:
                      type: string
                      description: Alias accepté (stocké addresse)
                    addresse:
                      type: string
                      example: "Cocody Angré"
                    ville:
                      type: string
                      example: "Abidjan"
                    telephone:
                      type: string
                      example: "+2250700000000"
                    codePostal:
                      type: string
                      example: "00225"
                    pays:
                      type: string
                      example: "CI"
                dateLivraison:
                  type: string
                  format: date
                  example: "2026-09-30"
            examples:
              monoVendeur:
                summary: Deux articles même boutique
                value:
                  articles:
                    - articleId: "68d6f43f92b0e26a12345678"
                      quantite: 2
                    - articleId: "68d6f43f92b0e26a87654321"
                      quantite: 1
                  infoCommande:
                    adresse: "Cocody Angré 8e tranche"
                    ville: "Abidjan"
                    telephone: "+2250700000000"
                    codePostal: "00225"
                    pays: "CI"
                  dateLivraison: "2026-09-30"
      responses:
        '201':
          description: Commande créée
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  _id:
                    type: string
                  statusCommande:
                    type: string
                    example: "En cours"
                  prixArticles:
                    type: number
                  prixLivraison:
                    type: number
                    example: 0
                  prixTotal:
                    type: number
                  articles:
                    type: array
                    items:
                      type: object
                      properties:
                        articleId:
                          type: string
                          nullable: true
                        nom:
                          type: string
                        quantite:
                          type: integer
                        prix:
                          type: number
                        image:
                          type: string
                          nullable: true
                  vendeur:
                    type: object
                    properties:
                      _id:
                        type: string
                      shopName:
                        type: string
        '400':
          description: Payload ou quantité invalide / champ interdit
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  code:
                    type: string
                    enum:
                      - INVALID_ORDER_PAYLOAD
                      - ORDER_FIELD_FORBIDDEN
                      - INVALID_ARTICLE_ID
                      - INVALID_ORDER_QUANTITY
                  message:
                    type: string
        '401':
          description: JWT absent ou invalide
        '404':
          description: Article introuvable
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: ARTICLE_NOT_FOUND
        '409':
          description: Stock, multi-vendeurs ou boutique indisponible
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                      - INSUFFICIENT_STOCK
                      - MULTI_VENDOR_ORDER_NOT_SUPPORTED
                      - VENDOR_NOT_AVAILABLE
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: SERVER_ERROR

  /api/commandes:
    get:
      summary: Obtenir toutes les commandes
      tags: [Commandes]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Numéro de page
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Nombre de commandes par page
        - in: query
          name: status
          schema:
            type: string
          description: Filtrer par statut
        - in: query
          name: utilisateur
          schema:
            type: string
          description: Filtrer par utilisateur
      responses:
        200:
          description: Liste des commandes récupérée avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  commandes:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        DateCommande:
                          type: string
                        DetailsCommande:
                          type: string
                        article:
                          type: object
                        utilisateur:
                          type: object
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
        500:
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/commande/{id}:
    get:
      summary: Obtenir une commande par ID
      tags: [Commandes]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID de la commande
      responses:
        200:
          description: Commande trouvée
          content:
            application/json:
              schema:
                type: object
        404:
          description: Commande non trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Mettre à jour une commande
      tags: [Commandes]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID de la commande
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                DateCommande:
                  type: string
                  format: date
                DetailsCommande:
                  type: string
                status:
                  type: string
                  enum: [en_attente, en_cours, livree, annulee]
      responses:
        200:
          description: Commande mise à jour avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        404:
          description: Commande non trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Supprimer une commande
      tags: [Commandes]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID de la commande
      responses:
        200:
          description: Commande supprimée avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        404:
          description: Commande non trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/commandes/stats:
    get:
      summary: Obtenir les statistiques des commandes
      tags: [Commandes]
      responses:
        200:
          description: Statistiques récupérées avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalCommandes:
                    type: integer
                    example: 150
                    description: "Nombre total de commandes"
                  commandesEnCours:
                    type: integer
                    example: 25
                    description: "Commandes en cours"
                  commandesLivrees:
                    type: integer
                    example: 120
                    description: "Commandes livrées"
                  chiffreAffaires:
                    type: number
                    example: 2500000
                    description: "Chiffre d'affaires total"
        500:
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
